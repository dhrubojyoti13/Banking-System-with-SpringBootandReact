
spring.application.name=BankingSystemAPI

server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system_api
spring.datasource.username=banking_app
spring.datasource.password=BankingApp@2026

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=MyPrivateBankingSystemJWTSecret2026!
  #${JWT_SECRET}
jwt.expiration=86400000

